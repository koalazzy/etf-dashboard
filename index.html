<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股ETF 每日复盘仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F8F8F8;
    --card: #FFFFFF;
    --accent: #FF7F50;
    --green: #4CAF50;
    --hero: #212121;
    --secondary: #757575;
    --border: #EEEEEE;
    --radius: 16px;
    --shadow: 0px 4px 12px rgba(0,0,0,0.04);
    --chart-orange: #FF7F50;
    --chart-blue: #4A90D9;
    --chart-yellow: #F5A623;
    --chart-purple: #9B59B6;
    --chart-sage: #7CB342;
    --chart-grey: #90A4AE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--hero);
    min-height: 100vh;
    padding: 32px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1120px; margin: 0 auto; }
  .date-label {
    font-size: 13px; color: var(--secondary); margin-bottom: 20px;
    letter-spacing: 0.3px;
  }

  /* Top Banner */
  .hero-banner {
    background: var(--card); border-radius: var(--radius);
    padding: 36px 40px; margin-bottom: 24px;
    box-shadow: var(--shadow); display: flex;
    justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 20px;
  }
  .hero-banner .label {
    font-size: 13px; color: var(--secondary); letter-spacing: 0.8px;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .hero-banner .value {
    font-size: 44px; font-weight: 700; color: var(--hero);
    letter-spacing: -1px; line-height: 1;
  }
  .hero-banner .gain {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 16px; font-weight: 600; padding: 6px 14px;
    border-radius: 20px; margin-top: 8px;
  }
  .gain.positive { color: var(--green); background: rgba(76,175,80,0.08); }
  .gain.negative { color: #E53935; background: rgba(229,57,53,0.08); }
  .hero-banner .meta { font-size: 13px; color: var(--secondary); margin-top: 4px; }

  /* Charts Row */
  .charts-row {
    display: grid; grid-template-columns: 1.35fr 0.65fr;
    gap: 24px; margin-bottom: 24px;
  }
  .chart-card {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 30px; box-shadow: var(--shadow);
  }
  .chart-card h3 {
    font-size: 15px; font-weight: 600; color: var(--hero);
    margin-bottom: 20px; letter-spacing: 0.2px;
  }
  .chart-card .area-chart-wrap { position: relative; height: 260px; }
  .chart-card .donut-wrap {
    display: flex; align-items: center; gap: 28px;
    flex-wrap: wrap; justify-content: center;
  }
  .donut-wrap canvas { max-width: 180px; max-height: 180px; }
  .donut-legend { flex: 1; min-width: 140px; }
  .donut-legend .item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; font-size: 13px; color: var(--hero);
  }
  .donut-legend .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .donut-legend .val { margin-left: auto; font-weight: 600; font-size: 13px; color: var(--hero); }

  /* Holdings List */
  .holdings-card {
    background: var(--card); border-radius: var(--radius);
    padding: 28px 30px; box-shadow: var(--shadow); margin-bottom: 24px;
  }
  .holdings-card h3 {
    font-size: 15px; font-weight: 600; color: var(--hero);
    margin-bottom: 18px; letter-spacing: 0.2px;
  }
  .holding-row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 0; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .holding-row:last-child { border-bottom: none; }
  .holding-icon {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 0.5px;
  }
  .icon-c1 { background: #FFE0D5; color: #FF7F50; }
  .icon-c2 { background: #D5E5F7; color: #4A90D9; }
  .icon-c3 { background: #E8F5E0; color: #7CB342; }
  .icon-c4 { background: #EDE0F2; color: #9B59B6; }
  .holding-info { flex: 1; min-width: 120px; }
  .holding-info .name { font-size: 14px; font-weight: 600; color: var(--hero); }
  .holding-info .code { font-size: 12px; color: var(--secondary); margin-top: 2px; }
  .holding-price { text-align: right; min-width: 90px; }
  .holding-price .val { font-size: 16px; font-weight: 700; color: var(--hero); }
  .holding-price .lbl { font-size: 11px; color: var(--secondary); }
  .holding-change { text-align: right; min-width: 80px; }
  .holding-change .pct {
    font-size: 14px; font-weight: 600; padding: 4px 10px;
    border-radius: 6px; display: inline-block;
  }
  .holding-change .pct.up { color: var(--green); background: rgba(76,175,80,0.08); }
  .holding-change .pct.down { color: #E53935; background: rgba(229,57,53,0.08); }
  .holding-volume { text-align: right; min-width: 90px; font-size: 13px; color: var(--secondary); }
  .holding-volume strong { color: var(--hero); font-weight: 600; }

  /* Bottom Bar */
  .footer-card {
    background: var(--card); border-radius: var(--radius);
    padding: 22px 30px; box-shadow: var(--shadow);
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 14px;
  }
  .footer-card .disclaimer {
    font-size: 12px; color: var(--secondary); line-height: 1.6;
    max-width: 500px;
  }
  .footer-card .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .footer-card .tag {
    font-size: 11px; padding: 5px 12px; border-radius: 14px;
    background: rgba(255,127,80,0.08); color: var(--accent);
    font-weight: 600; letter-spacing: 0.3px;
  }

  .refresh-bar {
    display: flex; justify-content: flex-end; margin-bottom: 20px;
  }
  .btn {
    padding: 10px 22px; border-radius: 10px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.2s; letter-spacing: 0.3px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #e87045; }
  .btn-secondary { background: transparent; color: var(--secondary); }
  .btn-secondary:hover { color: var(--hero); }

  /* Responsive */
  @media (max-width: 768px) {
    body { padding: 16px 12px; }
    .charts-row { grid-template-columns: 1fr; }
    .hero-banner { padding: 24px 22px; }
    .hero-banner .value { font-size: 32px; }
    .chart-card { padding: 20px 18px; }
    .holdings-card { padding: 20px 18px; }
    .footer-card { padding: 16px 18px; }
    .holding-row { gap: 10px; padding: 12px 0; }
    .holding-volume { display: none; }
    .donut-wrap { flex-direction: column; align-items: center; }
    .donut-legend { min-width: auto; width: 100%; }
  }
  @media (max-width: 480px) {
    .hero-banner .value { font-size: 26px; }
    .holding-price { min-width: 70px; }
    .holding-change { min-width: 60px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="date-label" id="dateLabel">--</div>

  <!-- Top Banner -->
  <div class="hero-banner">
    <div>
      <div class="label">资产总值</div>
      <div class="value" id="totalValue">--</div>
      <div class="meta" id="holdingsCount">--</div>
    </div>
    <div style="text-align:right">
      <div class="label">今日收益</div>
      <div class="gain" id="totalGain">--</div>
    </div>
  </div>

  <!-- Charts -->
  <div class="charts-row">
    <div class="chart-card">
      <h3>资产增长趋势</h3>
      <div class="area-chart-wrap"><canvas id="areaChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>资产配置</h3>
      <div class="donut-wrap">
        <canvas id="donutChart"></canvas>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>
  </div>

  <!-- Holdings -->
  <div class="holdings-card">
    <h3>持仓明细</h3>
    <div id="holdingsList"></div>
  </div>

  <!-- Footer -->
  <div class="footer-card">
    <div class="disclaimer">
      数据仅供参考，不构成投资建议。过往表现不代表未来收益。投资有风险，入市需谨慎。
    </div>
    <div class="tags">
      <span class="tag">#投资组合</span>
      <span class="tag">#资产配置</span>
      <span class="tag">#ETF</span>
    </div>
  </div>
</div>

<script>
const ETF_CONFIG = [
  { code: '515080', name: '中证红利ETF',    color: 'icon-c1', chartColor: '#FF7F50', label: '红利' },
  { code: '588000', name: '科创50ETF',      color: 'icon-c2', chartColor: '#4A90D9', label: '科创' },
  { code: '512010', name: '医药ETF',        color: 'icon-c3', chartColor: '#7CB342', label: '医药' },
  { code: '589720', name: '创新药ETF',      color: 'icon-c4', chartColor: '#9B59B6', label: '创新药' }
];

const HOLDINGS = [
  { shares: 50000, avgCost: 1.56 },
  { shares: 30000, avgCost: 1.62 },
  { shares: 80000, avgCost: 0.46 },
  { shares: 60000, avgCost: 0.90 }
];

function getMockData() {
  const d = new Date().getDate();
  const rnd = (base, range) => +(base + (Math.sin(d * 7 + base * 3) * 0.5 + 0.5) * range).toFixed(3);
  return [
    { price: rnd(1.58, 0.08), change: rnd(0.30, 1.20),  volume: rnd(2.3, 1.5), turnover: rnd(3.8, 2.0) },
    { price: rnd(1.64, 0.12), change: rnd(-0.50, 2.00), volume: rnd(6.5, 3.0), turnover: rnd(10.7, 4.0) },
    { price: rnd(0.48, 0.04), change: rnd(0.80, 1.50),  volume: rnd(8.0, 4.0), turnover: rnd(4.1, 2.0) },
    { price: rnd(0.92, 0.06), change: rnd(-0.20, 1.80), volume: rnd(1.8, 1.0), turnover: rnd(1.6, 0.8) }
  ];
}

function getHistoryData(data) {
  const days = 30;
  const result = [];
  const initVals = data.map((d, i) => HOLDINGS[i].shares * (d.price - d.price * d.change / 100));
  for (let t = 0; t < days; t++) {
    const noise = Math.sin(t * 0.4) * 0.015 + (Math.random() - 0.5) * 0.008;
    const total = initVals.reduce((s, v, i) => s + v * (1 + noise * (i + 1) * 0.3), 0);
    result.push({ x: t, y: Math.round(total * 100) / 100 });
  }
  // Append today
  const todayTotal = data.reduce((s, d, i) => s + HOLDINGS[i].shares * d.price, 0);
  result.push({ x: days, y: Math.round(todayTotal * 100) / 100 });
  return result;
}

let areaChart = null, donutChart = null;

function renderDate() {
  const now = new Date();
  const w = ['日','一','二','三','四','五','六'];
  document.getElementById('dateLabel').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${w[now.getDay()]} · 复盘报告`;
}

function renderHero(data) {
  const total = data.reduce((s, d, i) => s + HOLDINGS[i].shares * d.price, 0);
  const prevTotal = data.reduce((s, d, i) => s + HOLDINGS[i].shares * (d.price - d.price * d.change / 100), 0);
  const gainPct = prevTotal > 0 ? ((total - prevTotal) / prevTotal * 100) : 0;
  document.getElementById('totalValue').textContent = '¥' + total.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById('holdingsCount').textContent = `共持有 ${ETF_CONFIG.length} 只 ETF`;
  const gainEl = document.getElementById('totalGain');
  const up = gainPct >= 0;
  gainEl.className = 'gain ' + (up ? 'positive' : 'negative');
  gainEl.innerHTML = (up ? '▲' : '▼') + ' ' + Math.abs(gainPct).toFixed(2) + '%';
}

function renderAreaChart(data) {
  const history = getHistoryData(data);
  const ctx = document.getElementById('areaChart').getContext('2d');
  if (areaChart) areaChart.destroy();

  const gradient = ctx.createLinearGradient(0, 0, 0, 260);
  gradient.addColorStop(0, 'rgba(255,127,80,0.18)');
  gradient.addColorStop(1, 'rgba(255,127,80,0)');

  areaChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [{
        label: '资产总值',
        data: history,
        borderColor: '#FF7F50',
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 5,
        pointHoverBackgroundColor: '#FF7F50',
        pointHoverBorderColor: '#fff',
        pointHoverBorderWidth: 2,
        fill: true,
        backgroundColor: gradient,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: { legend: { display: false } },
      scales: {
        x: {
          type: 'linear',
          ticks: { display: false },
          grid: { display: false },
          border: { display: false }
        },
        y: {
          position: 'right',
          ticks: {
            color: '#757575', font: { size: 11 },
            callback: v => '¥' + (v / 10000).toFixed(1) + '万',
            maxTicksLimit: 5
          },
          grid: { color: 'rgba(0,0,0,0.04)', drawBorder: false }
        }
      }
    }
  });
}

function renderDonutChart(data) {
  const ctx = document.getElementById('donutChart').getContext('2d');
  if (donutChart) donutChart.destroy();
  const values = data.map((d, i) => HOLDINGS[i].shares * d.price);
  const total = values.reduce((a, b) => a + b, 0);

  donutChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ETF_CONFIG.map(c => c.name),
      datasets: [{
        data: values,
        backgroundColor: ETF_CONFIG.map(c => c.chartColor),
        borderColor: '#FFFFFF',
        borderWidth: 3,
        borderRadius: 4,
        hoverBorderWidth: 3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      cutout: '68%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const pct = ((ctx.raw / total) * 100).toFixed(1);
              return ctx.label + ': ¥' + ctx.raw.toLocaleString() + ' (' + pct + '%)';
            }
          }
        }
      }
    }
  });

  // Legend
  const legendEl = document.getElementById('donutLegend');
  legendEl.innerHTML = ETF_CONFIG.map((c, i) => {
    const pct = ((values[i] / total) * 100).toFixed(1);
    return `<div class="item">
      <span class="dot" style="background:${c.chartColor}"></span>
      <span>${c.label}</span>
      <span class="val">${pct}%</span>
    </div>`;
  }).join('');
}

function renderHoldings(data) {
  const container = document.getElementById('holdingsList');
  container.innerHTML = data.map((d, i) => {
    const cfg = ETF_CONFIG[i];
    const up = d.change >= 0;
    const marketValue = HOLDINGS[i].shares * d.price;
    const costValue = HOLDINGS[i].shares * HOLDINGS[i].avgCost;
    const totalGainPct = ((marketValue - costValue) / costValue * 100);
    return `
    <div class="holding-row">
      <div class="holding-icon ${cfg.color}">${cfg.label}</div>
      <div class="holding-info">
        <div class="name">${cfg.name}</div>
        <div class="code">${cfg.code} · 持有 ${(HOLDINGS[i].shares/10000).toFixed(1)} 万份</div>
      </div>
      <div class="holding-price">
        <div class="val">¥${d.price.toFixed(3)}</div>
        <div class="lbl">市值 ¥${(marketValue/10000).toFixed(1)}万</div>
      </div>
      <div class="holding-change">
        <span class="pct ${up ? 'up' : 'down'}">${up ? '+' : ''}${d.change.toFixed(2)}%</span>
        <div class="lbl" style="margin-top:3px;font-size:11px;color:${totalGainPct>=0?'#4CAF50':'#E53935'}">
          持仓${totalGainPct>=0?'+':''}${totalGainPct.toFixed(2)}%
        </div>
      </div>
      <div class="holding-volume">
        成交量<br><strong>${d.volume.toFixed(1)}亿手</strong>
      </div>
      <div class="holding-volume">
        成交额<br><strong>${d.turnover.toFixed(2)}亿</strong>
      </div>
    </div>`;
  }).join('');
}

async function loadData() {
  let data = null;
  try {
    const resp = await fetch('etf-data.json?' + Date.now());
    if (resp.ok) data = await resp.json();
  } catch (_) {}
  if (!data) data = getMockData();

  renderHero(data);
  renderAreaChart(data);
  renderDonutChart(data);
  renderHoldings(data);
}

renderDate();
loadData();
</script>
</body>
</html>
